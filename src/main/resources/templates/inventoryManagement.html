<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <!-- link bootstrap -->
    <link class="stylesheet" th:href="@{/css/bootstrap-5.3.7-dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-5.3.7-dist/css/bootstrap.min.css}">
    <!-- link css -->
    <link rel="stylesheet" th:href="@{/css/inventory.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/sweetalert2/sweetalert2.min.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
<div class="app-container">
    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar('inventory')}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Topbar -->
        <div th:replace="~{fragments/layout :: topbar}"></div>

        <!-- Inventory Management Header -->
        <div class="top-navbar w-100 d-flex justify-content-center py-3 mb-4 shadow-sm">
            <div class="d-flex flex-row align-items-center justify-content-between w-75">
                <h2 class="mb-0 text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" height="35px" viewBox="0 -960 960 960" width="35px"
                        fill="#FFFFFF">
                        <path
                            d="M440-183v-274L200-596v274l240 139Zm80 0 240-139v-274L520-457v274ZM480-492l226-130-226-132-226 132 226 130Zm-40 376v-533L107-550q-19 11-33 30.5T60-475v315q0 30 15 54.5t50 25.5l315 180ZM480-80l315-180q35-1 50-25.5t15-54.5v-315q0-25-14-44.5T813-730L480-920 147-730q-19 11-33 30.5T100-655v315l340 196Z" />
                    </svg>
                    <span class="ms-2">Inventory Management</span>
                </h2>
            </div>
        </div>
        <!-- Main Content Area -->
        <div class="container-fluid">
            <div class="tab-container">
                <div class="tab-header">
                    <button class="tab-btn active" onclick="openTab(event, 'materials-content')">Material Inventory</button>
                    <button class="tab-btn" onclick="openTab(event, 'grns-content')">Goods Received Notes (GRN)</button>
                </div>

                <!-- Materials Tab Pane -->
                <div id="materials-content" class="tab-content" style="display: block;">
                    <!-- Search & Buttons -->
                    <div class="d-flex flex-row align-items-center justify-content-between mb-4">
                        <div class="searchBar w-50 m-3">
                            <span class="px-2">
                                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                                    fill="#7d7c7c">
                                    <path
                                        d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z" />
                                </svg>
                            </span>
                            <input type="text" class="searchInput" id="searchInventory" placeholder="Search Item Name or Unit">
                        </div>
                        <div class="d-flex gap-3">
                            <button class="btn btn-teal" data-bs-toggle="modal" data-bs-target="#usageModal">
                                <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20"
                                    fill="currentColor" class="me-2">
                                    <path
                                        d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h560v-280h80v280q0 33-23.5 56.5T760-120H200Zm188-212-56-56 372-372H560v-80h280v280h-80v-144L388-332Z" />
                                </svg>
                                Record Usage
                            </button>
                            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addMaterialModal">
                                <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20"
                                    fill="currentColor" class="me-2">
                                    <path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z" />
                                </svg>
                                Add Material
                            </button>
                        </div>
                    </div>

                    <!-- Inventory Table -->
                    <div class="table-responsive">
                        <table class="inventoryTable" id="materialTable">
                            <thead>
                                <tr>
                                    <th>Item Name</th>
                                    <th>Available Quantity</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Loop through materials and their variants from backend -->
                                <th:block th:each="material : ${materials}">
                                    <tr th:each="variant : ${material.variants}" th:class="${variant.calculatedStatus == 'Low Stock' ? 'low-stock' : ''}">
                                        <td>
                                            <span th:text="${material.name}" class="fw-semibold"></span>
                                            <span th:text="${variant.gsm != null ? ' - ' + variant.gsm + ' GSM' : ''}"></span>
                                            <span th:text="${variant.widthMm != null && variant.heightMm != null ? ' (' + variant.widthMm + 'x' + variant.heightMm + ' mm)' : ''}"></span>
                                        </td>
                                        <td>
                                            <span th:text="${variant.availableQuantity != null ? variant.availableQuantity : 0}">0</span>
                                            <span class="text-muted" th:text="${' ' + variant.unit}"></span>
                                        </td>
                                        <td>
                                            <span class="badge" th:text="${variant.calculatedStatus}"
                                                th:class="${variant.calculatedStatus == 'Low Stock' ? 'badge bg-warning text-dark' : variant.calculatedStatus == 'Out of Stock' ? 'badge bg-danger' : 'badge bg-success'}"></span>
                                        </td>
                                        <td class="d-flex flex-row justify-content-center gap-2">
                                            <button class="btn btn-sm btn-teal px-3 py-2 text-dark" th:onclick="|updateMaterial(${material.id})|">Edit</button>
                                            <button class="btn btn-sm btn-red px-3 py-2 text-dark" th:onclick="|deleteMaterial(${material.id})|">Delete</button>
                                        </td>
                                    </tr>
                                </th:block>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- GRN Tab Pane -->
                <div id="grns-content" class="tab-content" style="display: none;">
                    <!-- Search & Buttons -->
                    <div class="d-flex flex-row align-items-center justify-content-between mb-4">
                        <div class="searchBar w-50 m-3">
                            <span class="px-2">
                                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                                    fill="#7d7c7c">
                                    <path
                                        d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z" />
                                </svg>
                            </span>
                            <input type="text" class="searchInput" id="searchGRN" placeholder="Search GRN Number, Supplier, or Material">
                        </div>
                        <div class="d-flex gap-3">
                            <button class="btn btn-gold" data-bs-toggle="modal" data-bs-target="#grnModal">
                                <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20"
                                    fill="currentColor" class="me-2">
                                    <path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z" />
                                </svg>
                                Receive Goods (GRN)
                            </button>
                        </div>
                    </div>

                    <!-- GRN Table -->
                    <div class="table-responsive">
                        <table class="inventoryTable" id="grnTable">
                            <thead>
                                <tr>
                                    <th>GRN Number</th>
                                    <th>Material / Item</th>
                                    <th>Supplier</th>
                                    <th>Received Qty</th>
                                    <th>Unit</th>
                                    <th>Invoice No</th>
                                    <th>Batch No</th>
                                    <th>Date Received</th>
                                    <th>Expiry Date</th>
                                    <th>Received By</th>
                                    <th>Notes</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Loop through GRNs from backend -->
                                <tr th:each="grn : ${grns}">
                                    <td class="fw-bold text-start ps-3" th:text="${grn.grnNumber}"></td>
                                    <td th:text="${grn.variant != null && grn.variant.material != null ? grn.variant.material.name : '-'}"></td>
                                    <td th:text="${grn.suppliers != null ? grn.suppliers.companyname : '-'}"></td>
                                    <td th:text="${grn.receivedquantity}"></td>
                                    <td th:text="${grn.variant != null ? grn.variant.unit : '-'}"></td>
                                    <td th:text="${grn.supplierInvoiceNo}"></td>
                                    <td th:text="${grn.batchNo}"></td>
                                    <td th:text="${grn.receivedDate}"></td>
                                    <td th:text="${grn.expiryDate != null ? grn.expiryDate : '-'}"></td>
                                    <td th:text="${grn.receivedByUser != null ? grn.receivedByUser.username : '-'}"></td>
                                    <td th:text="${grn.notes != null && !grn.notes.empty ? grn.notes : '-'}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

    <!-- GRN Modal -->
    <div class="modal fade" id="grnModal" tabindex="-1" aria-labelledby="grnModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg invModal">
            <div class="modal-content p-4 shadow-lg rounded-4">
                <div class="modal-header d-inline-flex justify-content-between align-items-center p-3">
                    <h4 class="modal-title text-white">Receive Goods (GRN)</h4>
                    <button type="button" class="btn btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form class="row g-3" id="grnFormData" onsubmit="submitGRN(event)">
                        <div class="col-md-6">
                            <label for="grnNumber" class="form-label">GRN Number</label>
                            <input type="text" class="form-control" id="grnNumber" name="grnNumber" placeholder="Auto-generated when saved" readonly>
                        </div>
                        <div class="col-md-6">
                            <label for="grnSupplierInvoice" class="form-label">Supplier Invoice No</label>
                            <input type="text" class="form-control" id="grnSupplierInvoice" name="supplierInvoiceNo" placeholder="Enter invoice number" required>
                        </div>
                        <div class="col-md-6">
                            <label for="grnBatchNo" class="form-label">Batch Number</label>
                            <input type="text" class="form-control" id="grnBatchNo" name="batchNo" placeholder="Enter batch number" required>
                        </div>
                        <div class="col-md-6">
                            <label for="grnSupplier" class="form-label">Supplier</label>
                            <select class="form-select" id="grnSupplier" name="supplierId" required>
                                <option selected disabled>Select Supplier</option>
                                <option th:each="supplier : ${suppliers}" th:value="${supplier.id}" th:text="${supplier.companyname}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="grnMaterial" class="form-label">Material Family</label>
                            <select class="form-select" id="grnMaterial" name="materialId" required onchange="loadVariants()">
                                <option selected disabled>Select Material</option>
                                <option th:each="material : ${materials}" th:value="${material.id}" th:text="${material.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="grnVariant" class="form-label">Variant (GSM/Size)</label>
                            <select class="form-select" id="grnVariant" name="variantId" required>
                                <option selected disabled>Select Variant</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="grnQty" class="form-label">Received Quantity</label>
                            <input type="number" class="form-control" id="grnQty" name="recivedquantity" placeholder="Enter quantity" required>
                        </div>
                        <div class="col-md-6">
                            <label for="grnUnits" class="form-label">Units</label>
                            <input type="text" class="form-control" id="grnUnits" name="units" placeholder="Unit (auto-filled)" readonly>
                        </div>
                        <div class="col-md-6">
                            <label for="grnDate" class="form-label">Date Received</label>
                            <input type="date" class="form-control" id="grnDate" name="dateReceived" required>
                        </div>
                        <div class="col-md-6">
                            <label for="grnExpiryDate" class="form-label">Expiry Date</label>
                            <input type="date" class="form-control" id="grnExpiryDate" name="expiryDate" placeholder="Enter expiry date">
                        </div>
                        <div class="col-md-6">
                            <label for="grnReceivedBy" class="form-label">Received By</label>
                            <select class="form-select" id="grnReceivedBy" name="receivedByUserId" required>
                                <option selected disabled>Select User</option>
                                <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.username}"></option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label for="grnNotes" class="form-label">Notes / Remarks</label>
                            <textarea class="form-control" id="grnNotes" name="notes" rows="3" placeholder="Enter any notes or remarks"></textarea>
                        </div>
                        <div class="col-12 text-end mt-4">
                            <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-teal">Save GRN</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Usage Modal -->
    <div class="modal fade" id="usageModal" tabindex="-1" aria-labelledby="usageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg invModal">
            <div class="modal-content p-4 shadow-lg rounded-4">
                <div class="modal-header d-inline-flex justify-content-between align-items-center p-3">
                    <h4 class="modal-title text-white">Record Material Usage</h4>
                    <button type="button" class="btn btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form class="row g-3" id="usageFormData" onsubmit="submitUsage(event)">
                        <div class="col-md-6">
                            <label for="usageItem" class="form-label">Item / Material</label>
                            <select class="form-select" id="usageItem" name="materialId" required>
                                <option selected disabled>Select Item</option>
                                <option th:each="material : ${materials}" th:value="${material.id}" th:text="${material.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="usageQty" class="form-label">Quantity Used</label>
                            <input type="number" class="form-control" id="usageQty" name="quantityUsed" placeholder="Enter amount used" required>
                        </div>
                        <div class="col-md-6">
                            <label for="usageJob" class="form-label">Job ID / Purpose</label>
                            <input type="text" class="form-control" id="usageJob" name="purpose" placeholder="e.g. Job #1234" required>
                        </div>
                        <div class="col-md-6">
                            <label for="usageDate" class="form-label">Date Used</label>
                            <input type="date" class="form-control" id="usageDate" name="dateUsed" required>
                        </div>
                        <div class="col-12 text-end mt-4">
                            <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-teal">Record Usage</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Material Modal -->
    <div class="modal fade" id="addMaterialModal" tabindex="-1" aria-labelledby="addMaterialModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg invModal">
            <div class="modal-content p-4 shadow-lg rounded-4">
                <div class="modal-header d-inline-flex justify-content-between align-items-center p-3">
                    <h4 class="modal-title text-white" id="addMaterialModalHeader">Add Material</h4>
                    <button type="button" class="btn btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form class="row g-3" id="materialFormData" onsubmit="submitMaterial(event)">
                        <div class="col-md-6">
                            <label for="materialName" class="form-label">Material Name</label>
                            <input type="text" class="form-control" id="materialName" name="name" placeholder="Enter material name" required>
                        </div>
                        <div class="col-12">
                            <label for="materialStatus" class="form-label">Status</label>
                            <select class="form-select" id="materialStatus" name="status" required>
                                <option selected disabled>Select Status</option>
                                <option value="ACTIVE">Active</option>
                                <option value="INACTIVE">Inactive</option>
                            </select>
                        </div>
                        <div class="col-12 text-end mt-4">
                            <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Material</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- link jquery -->
    <script th:src="@{/js/jquery-4.0.0.min.js}"></script>

    <!-- link sweetalert css and js -->
    <script th:src="@{/sweetalert2/sweetalert2.min.js}"></script>

    <!-- link common js file -->
    <script th:src="@{/js/common.js}"></script>

    <!-- link inventory js file -->
    <script th:src="@{/js/inventory.js}"></script>

    <!-- link js bootstrap -->
    <script th:src="@{/css/bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js}"></script>

    <script>
        // Simple script to auto-fill current date
        document.addEventListener('DOMContentLoaded', function () {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('grnDate').value = today;
            document.getElementById('usageDate').value = today;
        });

        // Load variants when material is selected
        function loadVariants() {
            const materialSelect = document.getElementById('grnMaterial');
            const variantSelect = document.getElementById('grnVariant');
            const materialId = materialSelect.value;

            // Clear existing options
            variantSelect.innerHTML = '<option selected disabled>Select Variant</option>';

            if (materialId) {
                fetch('/inventory/api/materials/' + materialId + '/variants')
                    .then(response => response.json())
                    .then(data => {
                        data.forEach(variant => {
                            const option = document.createElement('option');
                            option.value = variant.id;
                            let text = 'Unit: ' + variant.unit;
                            if (variant.gsm) text += ', GSM: ' + variant.gsm;
                            if (variant.widthMm && variant.heightMm) text += ', Size: ' + variant.widthMm + 'mm x ' + variant.heightMm + 'mm';
                            option.textContent = text;
                            option.dataset.unit = variant.unit;
                            variantSelect.appendChild(option);
                        });
                    })
                    .catch(error => console.error('Error loading variants:', error));
            }
        }

        // Update units field when variant is selected
        document.addEventListener('change', function(e) {
            if (e.target && e.target.id === 'grnVariant') {
                const selectedOption = e.target.options[e.target.selectedIndex];
                const unitField = document.getElementById('grnUnits');
                if (selectedOption.dataset.unit) {
                    unitField.value = selectedOption.dataset.unit;
                }
            }
        });
    </script>
</body>

</html>
